<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f7f8fc" />
    <meta
      name="description"
      content="A small, growing collection of skills and creative tools. Browse, try a demo, and take what you need."
    />
    <title>Skill shelf / wuwwa</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='10' fill='%235357d9'/%3E%3Cpath d='M9 12v16h22V12M16 12v16m8-16v16' fill='none' stroke='white' stroke-width='3'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" type="module"></script>
  </head>
  <body>
    <a class="skip-link" href="#collection">Skip to collection</a>
    <header class="masthead">
      <a class="brand" href="./" aria-label="Skill shelf home"
        ><span class="brand-mark" aria-hidden="true">▥</span>wuwwa<span
          class="brand-divider"
          >/</span
        ><span class="brand-sub">Skill shelf</span></a
      ><a
        class="repo-link"
        href="https://github.com/wuwwa/wuwwa-skills"
        target="_blank"
        rel="noopener noreferrer"
        >GitHub <span aria-hidden="true">↗</span></a
      >
    </header>
    <main>
      <div class="intro">
        <div>
          <h1>Skills &amp; tools</h1>
          <p>Pick a skill or explore a tool.</p>
        </div>
        <label class="search"
          ><svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="10.5" cy="10.5" r="6.5" />
            <path d="m16 16 4 4" /></svg
          ><span class="sr-only">Search skills and tools</span
          ><input
            id="search"
            type="search"
            placeholder="Search skills and tools…"
            autocomplete="off"
        /></label>
      </div>
      <div class="workspace">
        <aside><nav id="categories" aria-label="Categories"></nav></aside>
        <section id="collection" aria-label="Skills and tools">
          <div class="collection-bar">
            <p id="result-count" role="status">Loading collection…</p>
            <label class="type-filter"
              ><span class="sr-only">Filter by type</span
              ><select id="kind">
                <option value="All">All types</option>
                <option value="Skill">Skills</option>
                <option value="Library">Libraries</option>
                <option value="Tool">Tools</option>
              </select></label
            >
          </div>
          <div class="grid" id="grid"></div>
          <div class="empty" id="empty" hidden>
            <h2>No matches</h2>
            <p>Try another search or clear your filters.</p>
            <button id="reset" class="button">Clear filters</button>
          </div>
          <div id="load-error" class="empty" hidden>
            <h2>Couldn’t load the collection</h2>
            <p>Refresh the page to try again.</p>
            <button id="retry" class="button">Retry</button>
          </div>
        </section>
      </div>
      <footer><span>Collected by wuwwa</span></footer>
    </main>
    <dialog id="detail" aria-labelledby="dialog-title">
      <div class="dialog-head">
        <span id="dialog-kind"></span
        ><button class="close" id="close" aria-label="Close dialog">×</button>
      </div>
      <h2 id="dialog-title"></h2>
      <div id="dialog-content"></div>
    </dialog>
    <div class="toast" role="status" id="toast"></div>
    <noscript
      ><p class="empty">
        Enable JavaScript to browse the catalog, or
        <a href="https://github.com/wuwwa/wuwwa-skills">browse the repository</a
        >.
      </p></noscript
    >
  </body>
</html>
